# The package-specific documentation settings, read by `deps/document.jl`.

pages = ["index.md", "data_sources.md", "scatter_graphs.md", "heatmap_graphs.md", "bar_graphs.md"]

# The contracts we use are `Metacells`', and the links in their descriptions point into its documentation. The structs
# a data source writes into are `SomeGraphs`'. Each URL names a version, so it needs updating when that package
# releases one.
[interlinks]
Metacells = "https://tanaylab.github.io/Metacells.jl/v0.1.0/objects.inv"
SomeGraphs = "https://tanaylab.github.io/SomeGraphs.jl/v0.2.0/objects.inv"
